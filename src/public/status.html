<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Digital Terminal | Status</title>
    <link href="styles/authentication.css" rel="stylesheet"/>
</head>

<body>

    <main class="container">

        <header class="page-header">
            <h1 id="statusTitle">Digital Terminal Status</h1>
            <p id="statusDescription" class="page-description">
                Please close the window.
            </p>
        </header>

        <section class="notice-card">
            <h2 id="statusHeading">Access Terminated</h2>
            <p id="statusMessage">
                The current session has ended. Please close the window.
            </p>
        </section>

    </main>

    <script src="scripts/status.js"></script>

</body>
</html>
