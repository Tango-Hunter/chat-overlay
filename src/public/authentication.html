<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, nofollow"
    >

    <title>Chat Overlay | Log On</title>

    <link
        href="styles/main.css"
        rel="stylesheet"
    >

</head>

<body>

    <main class="container authentication-container">

        <!-- PAGE HEADER -->

        <header class="page-header authentication-header">

            <h1>Chat Overlay</h1>

            <p class="page-description">
                Log on to manage your chat overlay settings.
            </p>

        </header>


        <!-- AUTHENTICATION -->

        <section class="authentication-card">

            <div class="card-header">

                <h2>Log On</h2>

                <p>
                    Enter your account credentials to continue.
                </p>

            </div>


            <form
                id="authenticationForm"
                autocomplete="on"
                novalidate
            >

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="password"
                        id="username"
                        name="username"
                        autocomplete="username"
                        spellcheck="false"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <div
                    id="authenticationMessage"
                    class="authentication-message"
                    role="alert"
                    aria-live="assertive"
                ></div>


                <!-- ACTIONS -->

                <div class="action-buttons">

                    <button
                        id="authenticateBtn"
                        type="submit"
                        class="btn-primary"
                    >
                        Log On
                    </button>

                    <button
                        id="exitBtn"
                        type="button"
                        class="btn-secondary"
                    >
                        Exit
                    </button>

                </div>

            </form>

        </section>


        <!-- ACCOUNT NOTICE -->

        <section class="notice-card authentication-notice">

            <h2>Account Access</h2>

            <p>
                Your account credentials are required to access and manage
                your chat overlay.
            </p>

            <p>
                Authentication is processed securely by the application
                server.
            </p>

        </section>

    </main>


    <script src="scripts/logon.js"></script>

</body>

</html>
